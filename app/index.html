<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MegaCSV: open large CSV files in your browser</title>
    <meta name="description" content="Open CSV files too big for Excel, in your browser. Your file is never uploaded." />
    <!-- One address for search engines: /app/?sample, www and http copies all point here. -->
    <link rel="canonical" href="https://megacsv.com/app/" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f3f4f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <script>
      // The light/dark choice saved by the website or the app, before first paint.
      try {
        var t = localStorage.getItem("megacsv-theme");
        if (t === "light" || t === "dark") document.documentElement.classList.add(t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
